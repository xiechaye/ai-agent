spring:
  application:
    name: ai-agent
  profiles:
    active: local
  ai:
    mcp:
      client:
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8888
        stdio:
          servers-configuration: classpath:mcp-servers.json
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
#    ollama:
#      base-url: http://localhost:11434
#      chat:
#        model: deepseek-r1:8b

# 联网搜索
# search-api密钥
search-api:
  api-key: api-key

# pexels（图片视频搜索）
pexels:
  api-key: api-key

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: cn.edu.xmu.aiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
alibaba:
  oss:
    endpoint: endpoint
    bucket-name: bucket-name
    access-key-id: access-key-id
    access-key-secret: access-key-secret
    region: region
daode:
  api-key: api-key